<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ripple Pond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed WebGL pond; small glass title card top-left; one control dock pinned to the bottom. Single dark look on purpose (it floats over a 3D scene). */
:root{
  --ink:#eef4f6;
  --ink-dim:#b4c3c9;
  --glass:rgba(8,18,26,.56);
  --glass-hi:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.14);
  --accent:#ffcf7a;
  --accent-ink:#2a1a05;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:#0b1622;color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#scene.orbiting{cursor:grabbing}

.head{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;max-width:min(360px,calc(100% - 32px));
  padding:14px 16px;background:var(--glass);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;gap:6px;transition:opacity .35s,transform .35s}
.head h1{margin:0;font-family:var(--display);font-weight:800;font-size:1.55rem;letter-spacing:-.01em;line-height:1;text-wrap:balance}
.head p{margin:0;color:var(--ink-dim);font-size:.82rem;line-height:1.45}
.head .keys{font-size:.72rem;letter-spacing:.04em;color:var(--ink-dim);opacity:.85}
kbd{font-family:var(--ui);font-size:.7rem;padding:1px 5px;border:1px solid var(--line);border-radius:4px;background:var(--glass-hi)}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(760px,calc(100% - 32px));box-sizing:border-box;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;
  padding:10px;background:var(--glass);border:1px solid var(--line);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:opacity .35s,transform .35s}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.label{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-dim);padding:0 4px 0 6px}
button{font:500 .85rem/1 var(--ui);color:var(--ink);background:var(--glass-hi);border:1px solid var(--line);
  border-radius:999px;padding:9px 14px;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .1s}
button:hover{background:rgba(255,255,255,.16)}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.hot{background:linear-gradient(180deg,#ff9d5c,#e8613a);border-color:#ff9d5c;color:#2a0d02;font-weight:600}
button.hot:hover{filter:brightness(1.08)}

body.clean .head{opacity:0;transform:translateY(-8px);pointer-events:none}
body.clean .dock{opacity:0;transform:translate(-50%,8px);pointer-events:none}

.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:.82rem;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:opacity .4s;opacity:0;pointer-events:none;
  max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}

.pad{position:fixed;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:none;
  grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:6px;transition:opacity .35s}
.pad .pk{padding:0;width:52px;height:52px;border-radius:14px;font-size:1.05rem;background:var(--glass);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);touch-action:none;user-select:none;-webkit-user-select:none}
.pad .pk.on{background:var(--accent);color:var(--accent-ink)}
.pad .up{grid-area:1/2}.pad .left{grid-area:2/1}.pad .boost{grid-area:2/2}.pad .right{grid-area:2/3}.pad .down{grid-area:3/2}
@media (pointer:coarse){ .pad{display:grid} }
body.clean .pad{opacity:0;pointer-events:none}

@media (max-width:520px){
  .head{padding:12px 14px}
  .head h1{font-size:1.3rem}
  .head .keys{display:none}
  button{padding:8px 12px;font-size:.8rem}
  .dock{justify-content:center}
}
@media (prefers-reduced-motion:reduce){ .head,.dock,.toast{transition:none} }
</style>

<canvas id="scene" aria-label="3D water you can touch to make waves"></canvas>

<header class="head" id="head">
  <h1>Ripple Pond</h1>
  <p>Sail the boat with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or the arrow keys. Drag on the water to make waves. Drag the sky to turn the camera, scroll to zoom.</p>
  <div class="keys"><kbd>Space</kbd> boost &nbsp;Â·&nbsp; <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> sky &nbsp;Â·&nbsp; <kbd>M</kbd> meteor &nbsp;Â·&nbsp; <kbd>F</kbd> follow &nbsp;Â·&nbsp; <kbd>H</kbd> hide</div>
</header>

<nav class="dock" id="dock" aria-label="Controls">
  <div class="group" role="group" aria-label="Sky">
    <span class="label">Sky</span>
    <button id="sky-sunrise" data-sky="sunrise" aria-pressed="true">Sunrise</button>
    <button id="sky-storm" data-sky="storm" aria-pressed="false">Storm</button>
    <button id="sky-night" data-sky="night" aria-pressed="false">Night</button>
  </div>
  <div class="group">
    <span class="label">Boat</span>
    <button id="cruise" aria-pressed="false">Auto cruise</button>
    <button id="follow" aria-pressed="false">Follow boat</button>
  </div>
  <div class="group">
    <button id="meteor" class="hot">Drop a meteor</button>
    <button id="calm">Calm water</button>
    <button id="lowpoly" aria-pressed="false">Low-poly</button>
    <button id="record">Record mode</button>
  </div>
</nav>

<div class="pad" id="pad" aria-label="Sailing controls">
  <button class="pk up" data-k="fwd" aria-label="Sail forward">â–²</button>
  <button class="pk left" data-k="left" aria-label="Turn left">â—€</button>
  <button class="pk boost" data-k="boost" aria-label="Boost">âš¡</button>
  <button class="pk right" data-k="right" aria-label="Turn right">â–¶</button>
  <button class="pk down" data-k="back" aria-label="Slow down">â–¼</button>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 600);
  scene.fog = new THREE.Fog(0xffffff, 30, 160);

  // ---------- Sky presets ----------
  const P = {
    sunrise: { skyTop:0x4f7fb8, skyBottom:0xffb98a, fog:0xf3c09a, water:0x2a7590, spec:0xffe2c0,
      hemiSky:0xffe3c4, hemiGround:0x24506a, hemiI:.75, sun:0xffc58a, sunI:1.3, dir:[-0.8,0.26,-0.55],
      disc:0xfff0d0, discA:1, discS:1.6, stars:0, rain:0, lantern:0.15, fogFar:170, spray:0xffffff },
    storm: { skyTop:0x262e35, skyBottom:0x66717b, fog:0x5b666f, water:0x2b444f, spec:0x9fb1bb,
      hemiSky:0x95a3ad, hemiGround:0x182329, hemiI:.7, sun:0xb7c3cb, sunI:.45, dir:[0.2,0.9,0.3],
      disc:0xdfe6ea, discA:0, discS:1.2, stars:0, rain:1, lantern:1.0, fogFar:95, spray:0xdfe8ee },
    night: { skyTop:0x040817, skyBottom:0x1a2c52, fog:0x13213f, water:0x10304d, spec:0xbfd4ff,
      hemiSky:0x41558a, hemiGround:0x05070d, hemiI:.55, sun:0xa8c2ff, sunI:.55, dir:[0.5,0.5,-0.7],
      disc:0xe9efff, discA:1, discS:0.85, stars:1, rain:0, lantern:2.4, fogFar:160, spray:0xcfe0ff }
  };
  const colorKeys = ['skyTop','skyBottom','fog','water','spec','hemiSky','hemiGround','sun','disc','spray'];
  const numKeys = ['hemiI','sunI','discA','discS','stars','rain','lantern','fogFar'];
  function makeState(p){
    const s = {};
    colorKeys.forEach(k => s[k] = new THREE.Color(p[k]));
    numKeys.forEach(k => s[k] = p[k]);
    s.dir = new THREE.Vector3(...p.dir).normalize();
    return s;
  }
  const targets = {}; Object.keys(P).forEach(k => targets[k] = makeState(P[k]));
  let skyName = 'sunrise';
  const cur = makeState(P.sunrise);

  // ---------- Sky dome ----------
  const skyMat = new THREE.ShaderMaterial({
    uniforms: { top:{value:new THREE.Color()}, bottom:{value:new THREE.Color()}, flash:{value:0} },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 bottom; uniform float flash; varying vec3 vP; void main(){ float h = clamp(vP.y*1.6+0.06,0.0,1.0); vec3 c = mix(bottom, top, pow(h,0.75)); c += flash*vec3(0.55,0.6,0.72); gl_FragColor = vec4(c,1.0); }',
    side: THREE.BackSide, depthWrite: false, fog: false
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), skyMat);
  scene.add(sky);

  const discMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, fog: false, depthWrite: false });
  const disc = new THREE.Mesh(new THREE.SphereGeometry(6, 24, 12), discMat);
  scene.add(disc);

  // stars
  const starGeo = new THREE.BufferGeometry();
  const starPos = [];
  for (let i = 0; i < 1100; i++) {
    const u = Math.random(), v = Math.random() * 0.95 + 0.05;
    const th = u * Math.PI * 2, y = v, r = Math.sqrt(1 - y * y);
    starPos.push(Math.cos(th) * r * 260, y * 260, Math.sin(th) * r * 260);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
  scene.add(new THREE.Points(starGeo, starMat));

  // ---------- Lights ----------
  const hemi = new THREE.HemisphereLight(0xffffff, 0x223344, 0.7);
  const sun = new THREE.DirectionalLight(0xffffff, 1);
  scene.add(hemi, sun, sun.target);

  // ---------- Water simulation ----------
  const N = 128, SIZE = 40, HALF = SIZE / 2, CELL = SIZE / (N - 1);
  let H = new Float32Array(N * N), V = new Float32Array(N * N);
  const K = 0.6, DAMP = 0.994;

  const waterGeo = new THREE.PlaneGeometry(SIZE, SIZE, N - 1, N - 1);
  waterGeo.rotateX(-Math.PI / 2);
  const wpos = waterGeo.attributes.position;
  const waterMat = new THREE.MeshPhongMaterial({ color: 0x2a7590, specular: 0xffffff, shininess: 90 });
  const water = new THREE.Mesh(waterGeo, waterMat);
  scene.add(water);

  // flat open sea around the pond so the horizon reads as ocean
  const FAR = 320;
  function seaStrip(w, d, x, z){
    const g = new THREE.PlaneGeometry(w, d); g.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(g, waterMat); m.position.set(x, 0, z); scene.add(m);
  }
  const band = FAR - HALF;
  seaStrip(FAR * 2, band, 0, -(HALF + band / 2));
  seaStrip(FAR * 2, band, 0, HALF + band / 2);
  seaStrip(band, SIZE, -(HALF + band / 2), 0);
  seaStrip(band, SIZE, HALF + band / 2, 0);

  function simStep(){
    for (let r = 1; r < N - 1; r++) {
      const o = r * N;
      for (let c = 1; c < N - 1; c++) {
        const i = o + c;
        const avg = (H[i - 1] + H[i + 1] + H[i - N] + H[i + N]) * 0.25;
        V[i] = (V[i] + (avg - H[i]) * K) * DAMP;
      }
    }
    for (let i = 0; i < N * N; i++) H[i] += V[i];
  }
  function drop(x, z, radius, strength){
    const cx = (x + HALF) / CELL, cr = (z + HALF) / CELL, rad = Math.max(radius / CELL, 1.5);
    const r0 = Math.max(1, Math.floor(cr - rad)), r1 = Math.min(N - 2, Math.ceil(cr + rad));
    const c0 = Math.max(1, Math.floor(cx - rad)), c1 = Math.min(N - 2, Math.ceil(cx + rad));
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      const d = Math.hypot(c - cx, r - cr);
      if (d < rad) H[r * N + c] += strength * 0.5 * (1 + Math.cos(Math.PI * d / rad));
    }
  }
  function heightAt(x, z){
    const fx = Math.min(Math.max((x + HALF) / CELL, 0), N - 1.001);
    const fz = Math.min(Math.max((z + HALF) / CELL, 0), N - 1.001);
    const c = Math.floor(fx), r = Math.floor(fz), tx = fx - c, tz = fz - r;
    const i = r * N + c;
    const a = H[i], b = H[i + 1], d = H[i + N], e = H[i + N + 1];
    return (a * (1 - tx) + b * tx) * (1 - tz) + (d * (1 - tx) + e * tx) * tz;
  }
  function pushToMesh(){
    const arr = wpos.array;
    for (let i = 0; i < N * N; i++) arr[i * 3 + 1] = H[i];
    wpos.needsUpdate = true;
    waterGeo.computeVertexNormals();
  }

  // ---------- Boat ----------
  const boat = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 0.9), new THREE.MeshLambertMaterial({ color: 0x8a4b2a }));
  const bow = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.8, 4), new THREE.MeshLambertMaterial({ color: 0x8a4b2a }));
  bow.rotation.z = -Math.PI / 2; bow.rotation.x = Math.PI / 4; bow.scale.set(1, 1, 0.55 / 0.45); bow.position.set(1.5, 0, 0);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.08, 0.76), new THREE.MeshLambertMaterial({ color: 0xc89a6a }));
  deck.position.y = 0.27;
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.45, 0.62), new THREE.MeshLambertMaterial({ color: 0xf1e4cc }));
  cabin.position.set(-0.45, 0.52, 0);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.07, 0.72), new THREE.MeshLambertMaterial({ color: 0xd2553a }));
  roof.position.set(-0.45, 0.78, 0);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 2.3, 8), new THREE.MeshLambertMaterial({ color: 0x5a3a22 }));
  mast.position.set(0.3, 1.4, 0);
  const sailGeo = new THREE.BufferGeometry();
  sailGeo.setAttribute('position', new THREE.Float32BufferAttribute([0.35,0.45,0, 0.35,2.45,0, 1.35,0.5,0], 3));
  sailGeo.computeVertexNormals();
  const sail = new THREE.Mesh(sailGeo, new THREE.MeshLambertMaterial({ color: 0xfaf6ee, side: THREE.DoubleSide }));
  const lanternMat = new THREE.MeshBasicMaterial({ color: 0xffc36e });
  const lanternMesh = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), lanternMat);
  lanternMesh.position.set(-0.95, 0.65, 0);
  const lantern = new THREE.PointLight(0xffb45a, 0.2, 10, 2);
  lantern.position.copy(lanternMesh.position);
  boat.add(hull, bow, deck, cabin, roof, mast, sail, lanternMesh, lantern);
  boat.rotation.order = 'YXZ';
  scene.add(boat);
  const bp = new THREE.Vector2(3, 2), bv = new THREE.Vector2(0.3, -0.2);
  let boatYaw = 0;
  // sailing input: keyboard, touch pad, or auto cruise
  const input = { fwd: 0, back: 0, left: 0, right: 0, boost: 0 };
  let cruise = false, follow = false, wakeT = 0, lastDriveT = -1e9;
  const keyMap = { w:'fwd', arrowup:'fwd', s:'back', arrowdown:'back', a:'left', arrowleft:'left', d:'right', arrowright:'right', ' ':'boost' };
  window.addEventListener('keyup', e => { const k = keyMap[e.key.toLowerCase()]; if (k) input[k] = 0; });
  window.addEventListener('blur', () => Object.keys(input).forEach(k => input[k] = 0));
  document.querySelectorAll('#pad .pk').forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); input[k] = 1; b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
    const off = () => { input[k] = 0; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });

  // ---------- Spray particles ----------
  const SP = 700;
  const spGeo = new THREE.BufferGeometry();
  const spArr = new Float32Array(SP * 3).fill(-999);
  spGeo.setAttribute('position', new THREE.BufferAttribute(spArr, 3));
  const spVel = new Float32Array(SP * 3), spLife = new Float32Array(SP);
  const spMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.85, depthWrite: false });
  scene.add(new THREE.Points(spGeo, spMat));
  let spHead = 0;
  function burst(x, z, n, power){
    for (let k = 0; k < n; k++) {
      const i = spHead; spHead = (spHead + 1) % SP;
      const a = Math.random() * Math.PI * 2, s = (0.4 + Math.random()) * power * 0.35;
      spArr[i*3] = x; spArr[i*3+1] = 0.05; spArr[i*3+2] = z;
      spVel[i*3] = Math.cos(a) * s; spVel[i*3+1] = power * (0.6 + Math.random() * 0.8); spVel[i*3+2] = Math.sin(a) * s;
      spLife[i] = 1;
    }
  }
  function updateSpray(dt){
    for (let i = 0; i < SP; i++) {
      if (spLife[i] <= 0) continue;
      spVel[i*3+1] -= 18 * dt;
      spArr[i*3] += spVel[i*3] * dt; spArr[i*3+1] += spVel[i*3+1] * dt; spArr[i*3+2] += spVel[i*3+2] * dt;
      spLife[i] -= dt * 0.9;
      if (spArr[i*3+1] < -0.2 || spLife[i] <= 0) { spLife[i] = 0; spArr[i*3+1] = -999; }
    }
    spGeo.attributes.position.needsUpdate = true;
  }

  // ---------- Rain ----------
  const RN = 1400, RBOX = 60, RTOP = 30;
  const rainArr = new Float32Array(RN * 6);
  for (let i = 0; i < RN; i++) {
    const x = (Math.random() - .5) * RBOX, y = Math.random() * RTOP, z = (Math.random() - .5) * RBOX;
    rainArr.set([x, y, z, x - 0.12, y - 0.9, z], i * 6);
  }
  const rainGeo = new THREE.BufferGeometry();
  rainGeo.setAttribute('position', new THREE.BufferAttribute(rainArr, 3));
  const rainMat = new THREE.LineBasicMaterial({ color: 0xcfd9e0, transparent: true, opacity: 0, depthWrite: false });
  const rain = new THREE.LineSegments(rainGeo, rainMat);
  scene.add(rain);
  function updateRain(dt){
    if (cur.rain < 0.02) { rain.visible = false; return; }
    rain.visible = true;
    const fall = 32 * dt;
    for (let i = 0; i < RN; i++) {
      const o = i * 6;
      rainArr[o+1] -= fall; rainArr[o+4] -= fall; rainArr[o] -= fall * 0.13; rainArr[o+3] -= fall * 0.13;
      if (rainArr[o+4] < 0) {
        const x = (Math.random() - .5) * RBOX, z = (Math.random() - .5) * RBOX, y = RTOP + Math.random() * 4;
        rainArr[o] = x; rainArr[o+1] = y; rainArr[o+2] = z; rainArr[o+3] = x - 0.12; rainArr[o+4] = y - 0.9; rainArr[o+5] = z;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  // ---------- Meteors ----------
  const meteors = [];
  const meteorGeo = new THREE.IcosahedronGeometry(0.7, 0);
  const meteorMat = new THREE.MeshPhongMaterial({ color: 0x3a2a22, emissive: 0xff6a2a, emissiveIntensity: 0.9, flatShading: true });
  const trailMat = new THREE.MeshBasicMaterial({ color: 0xffb070, transparent: true, opacity: 0.55, depthWrite: false });
  function launchMeteor(){
    const tx = (Math.random() - .5) * SIZE * 0.6, tz = (Math.random() - .5) * SIZE * 0.6;
    const m = new THREE.Mesh(meteorGeo, meteorMat);
    const trail = new THREE.Mesh(new THREE.ConeGeometry(0.55, 5, 10, 1, true), trailMat);
    trail.position.y = 2.6; m.add(trail);
    const vel = new THREE.Vector3(-10, -34, 6);
    const t = 1.05;
    m.position.set(tx - vel.x * t, -vel.y * t, tz - vel.z * t);
    m.lookAt(m.position.clone().sub(vel)); m.rotateX(-Math.PI / 2);
    scene.add(m);
    meteors.push({ m, vel, tx, tz });
  }
  function updateMeteors(dt){
    for (let k = meteors.length - 1; k >= 0; k--) {
      const o = meteors[k];
      o.m.position.addScaledVector(o.vel, dt);
      o.m.children[0].rotation.y += dt * 8;
      if (o.m.position.y <= heightAt(o.m.position.x, o.m.position.z)) {
        const x = o.m.position.x, z = o.m.position.z;
        drop(x, z, 2.8, -2.2);
        burst(x, z, 220, 14);
        flash = Math.max(flash, 0.25);
        scene.remove(o.m); o.m.children[0].geometry.dispose();
        meteors.splice(k, 1);
      }
    }
  }

  // ---------- Camera orbit ----------
  const orbit = { yaw: 0.75, pitch: 0.42, dist: 36 };
  const target = new THREE.Vector3(0, 0, 0);
  function placeCamera(){
    const cp = Math.cos(orbit.pitch);
    camera.position.set(target.x + Math.sin(orbit.yaw) * cp * orbit.dist, target.y + Math.sin(orbit.pitch) * orbit.dist, target.z + Math.cos(orbit.yaw) * cp * orbit.dist);
    camera.lookAt(target);
  }

  // ---------- Input ----------
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const tmp = new THREE.Vector3();
  function pick(e){
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (!ray.ray.intersectPlane(plane, tmp)) return null;
    if (Math.abs(tmp.x) > HALF - 0.6 || Math.abs(tmp.z) > HALF - 0.6) return null;
    return tmp.clone();
  }
  let drag = null, idle = 0;
  function poke(p, strong){
    drop(p.x, p.z, strong ? 1.6 : 1.1, strong ? -0.7 : -0.32);
    burst(p.x, p.z, strong ? 22 : 6, strong ? 7 : 4.5);
  }
  canvas.addEventListener('pointerdown', e => {
    idle = 0;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    const hit = pick(e);
    const orbitMode = e.button === 2 || e.shiftKey || !hit;
    drag = { id: e.pointerId, mode: orbitMode ? 'orbit' : 'wave', x: e.clientX, y: e.clientY, last: hit };
    if (orbitMode) canvas.classList.add('orbiting'); else poke(hit, true);
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    idle = 0;
    if (drag.mode === 'orbit') {
      orbit.yaw -= (e.clientX - drag.x) * 0.005;
      orbit.pitch = Math.min(1.35, Math.max(0.1, orbit.pitch + (e.clientY - drag.y) * 0.004));
      drag.x = e.clientX; drag.y = e.clientY;
    } else {
      const hit = pick(e);
      if (hit && (!drag.last || hit.distanceTo(drag.last) > 0.35)) { poke(hit, false); drag.last = hit; }
    }
  });
  const endDrag = e => { if (drag && e.pointerId === drag.id) { drag = null; canvas.classList.remove('orbiting'); } };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); idle = 0;
    orbit.dist = Math.min(70, Math.max(12, orbit.dist * Math.exp(e.deltaY * 0.001)));
  }, { passive: false });

  // ---------- UI ----------
  const toastEl = document.getElementById('toast');
  let toastT;
  function toast(msg, ms){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), ms || 2200);
  }
  const skyBtns = [...document.querySelectorAll('[data-sky]')];
  function setSky(name){
    skyName = name;
    skyBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sky === name)));
  }
  skyBtns.forEach(b => b.addEventListener('click', () => setSky(b.dataset.sky)));
  const cruiseBtn = document.getElementById('cruise'), followBtn = document.getElementById('follow');
  function setCruise(on){ cruise = on; cruiseBtn.setAttribute('aria-pressed', String(on)); toast(on ? 'Auto cruise on. The boat sails itself.' : 'Auto cruise off. You have the helm.'); }
  function setFollow(on){ follow = on; followBtn.setAttribute('aria-pressed', String(on)); if (on) orbit.dist = Math.min(orbit.dist, 24); }
  cruiseBtn.addEventListener('click', () => setCruise(!cruise));
  followBtn.addEventListener('click', () => setFollow(!follow));
  document.getElementById('meteor').addEventListener('click', launchMeteor);
  document.getElementById('calm').addEventListener('click', () => { H.fill(0); V.fill(0); toast('Water calmed'); });
  const lowBtn = document.getElementById('lowpoly');
  lowBtn.addEventListener('click', () => {
    waterMat.flatShading = !waterMat.flatShading; waterMat.needsUpdate = true;
    lowBtn.setAttribute('aria-pressed', String(waterMat.flatShading));
  });
  function setClean(on){
    document.body.classList.toggle('clean', on);
    if (on) toast('Controls hidden. Double-click or press H to bring them back.', 2600);
    else toastEl.classList.remove('show');
  }
  document.getElementById('record').addEventListener('click', () => setClean(true));
  canvas.addEventListener('dblclick', () => { if (document.body.classList.contains('clean')) setClean(false); });
  window.addEventListener('keydown', e => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    const k = e.key.toLowerCase();
    if (keyMap[k]) { input[keyMap[k]] = 1; e.preventDefault(); return; }
    if (k === 'f') { setFollow(!follow); return; }
    if (k === 'c') { setCruise(!cruise); return; }
    if (k === '1') setSky('sunrise');
    else if (k === '2') setSky('storm');
    else if (k === '3') setSky('night');
    else if (k === 'm') launchMeteor();
    else if (k === 'h') setClean(!document.body.classList.contains('clean'));
    else if (k === 'escape' && document.body.classList.contains('clean')) setClean(false);
  });

  // ---------- Resize ----------
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w < 600 ? 62 : 50;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Loop ----------
  let flash = 0, lightningT = 2, acc = 0, ambientT = 0, last = performance.now();
  const STEP = 1 / 60;
  // a few opening ripples so the first frame already shows waves
  drop(-4, -3, 1.8, -0.9); drop(6, 5, 1.4, -0.7); drop(-8, 7, 1.2, -0.5);
  for (let i = 0; i < 40; i++) simStep();

  function lerpState(k){
    const t = targets[skyName];
    colorKeys.forEach(key => cur[key].lerp(t[key], k));
    numKeys.forEach(key => cur[key] += (t[key] - cur[key]) * k);
    cur.dir.lerp(t.dir, k).normalize();
  }

  function frame(now){
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    idle += dt;

    lerpState(1 - Math.exp(-dt * 2.2));

    // ambient life on the surface
    ambientT -= dt;
    if (ambientT <= 0) {
      ambientT = 0.18 + Math.random() * 0.25;
      drop((Math.random() - .5) * SIZE * 0.9, (Math.random() - .5) * SIZE * 0.9, 1.0, -0.05);
    }
    // rain drops on the water
    if (cur.rain > 0.3) {
      const n = Math.random() < cur.rain * 0.9 ? 2 : 0;
      for (let i = 0; i < n; i++) drop((Math.random() - .5) * SIZE * 0.95, (Math.random() - .5) * SIZE * 0.95, 0.7, -0.09 * cur.rain);
    }
    // lightning
    if (skyName === 'storm') {
      lightningT -= dt;
      if (lightningT <= 0) { flash = 1; lightningT = 3 + Math.random() * 6; setTimeout(() => { flash = Math.max(flash, 0.7); }, 140); }
    }
    flash *= Math.exp(-dt * 7);

    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 4) { simStep(); acc -= STEP; steps++; }
    if (steps === 4) acc = 0;
    pushToMesh();

    // boat physics
    const e = 0.5;
    const gx = (heightAt(bp.x + e, bp.y) - heightAt(bp.x - e, bp.y)) / (2 * e);
    const gz = (heightAt(bp.x, bp.y + e) - heightAt(bp.x, bp.y - e)) / (2 * e);
    let thr = input.fwd - input.back * 0.6, steer = input.left - input.right;
    const boost = !!input.boost;
    if (boost && thr <= 0) thr = 1;
    const manual = thr !== 0 || steer !== 0;
    if (manual) lastDriveT = now;
    if (cruise && !manual) {
      thr = 0.75; steer = 0.28;
      // head back toward the middle when the pond edge gets close
      if (Math.max(Math.abs(bp.x), Math.abs(bp.y)) > HALF - 7) {
        let d = Math.atan2(bp.y, -bp.x) - boatYaw; d = Math.atan2(Math.sin(d), Math.cos(d));
        steer = Math.max(-1, Math.min(1, d * 2));
      }
    }
    const driving = manual || cruise || now - lastDriveT < 1500;
    const fx = Math.cos(boatYaw), fz = -Math.sin(boatYaw);
    bv.x -= gx * 14 * dt; bv.y -= gz * 14 * dt;   // waves push the boat
    let fwdSpeed = bv.x * fx + bv.y * fz;
    if (driving) {
      const power = thr * (boost ? 16 : 8);
      bv.x += fx * power * dt; bv.y += fz * power * dt;
      boatYaw += steer * dt * (0.5 + Math.min(1, Math.abs(fwdSpeed) / 4) * 1.5) * (fwdSpeed < -0.2 ? -1 : 1);
      // the keel stops the boat sliding sideways
      fwdSpeed = bv.x * fx + bv.y * fz;
      const kl = Math.exp(-dt * 3);
      bv.x = fx * fwdSpeed + (bv.x - fx * fwdSpeed) * kl;
      bv.y = fz * fwdSpeed + (bv.y - fz * fwdSpeed) * kl;
    } else {
      bv.x += Math.cos(now * 0.00013) * 0.05 * dt; bv.y += Math.sin(now * 0.00011) * 0.05 * dt;
    }
    bv.multiplyScalar(Math.exp(-dt * (driving ? 0.9 : 0.7)));
    const maxV = boost ? 11 : 7.5;
    if (bv.length() > maxV) bv.setLength(maxV);
    bp.addScaledVector(bv, dt);
    const lim = HALF - 2.2;
    if (bp.x > lim) { bp.x = lim; bv.x = -Math.abs(bv.x) * 0.6; }
    if (bp.x < -lim) { bp.x = -lim; bv.x = Math.abs(bv.x) * 0.6; }
    if (bp.y > lim) { bp.y = lim; bv.y = -Math.abs(bv.y) * 0.6; }
    if (bp.y < -lim) { bp.y = -lim; bv.y = Math.abs(bv.y) * 0.6; }
    if (!driving && bv.length() > 0.12) {
      const want = Math.atan2(-bv.y, bv.x);
      let d = want - boatYaw; d = Math.atan2(Math.sin(d), Math.cos(d));
      boatYaw += d * Math.min(1, dt * 2);
    }
    // wake behind the stern, bow wave and spray at speed
    const speed = bv.length();
    wakeT -= dt;
    if (speed > 1.2 && wakeT <= 0) {
      wakeT = 0.045;
      const hx = Math.cos(boatYaw), hz = -Math.sin(boatYaw);
      drop(bp.x - hx * 1.2, bp.y - hz * 1.2, 0.9, -0.05 - speed * 0.02);
      drop(bp.x + hx * 1.7, bp.y + hz * 1.7, 0.7, 0.03 + speed * 0.008);
      if (speed > 3) burst(bp.x + hx * 1.7, bp.y + hz * 1.7, Math.round(speed * 0.7), 2 + speed * 0.35);
    }
    boat.position.set(bp.x, heightAt(bp.x, bp.y) - 0.04, bp.y);
    const cy = Math.cos(boatYaw), sy = Math.sin(boatYaw);
    const along = gx * cy - gz * sy, across = gx * sy + gz * cy;
    const lean = driving ? steer * Math.min(1, speed / 6) * 0.18 : 0;
    const bowUp = Math.max(0, fwdSpeed) * 0.022;
    boat.rotation.set(Math.max(-0.5, Math.min(0.5, across * 1.4 + lean)), boatYaw, Math.max(-0.5, Math.min(0.5, along * 1.4 + bowUp)));

    updateSpray(dt);
    updateRain(dt);
    updateMeteors(dt);

    // apply look
    skyMat.uniforms.top.value.copy(cur.skyTop);
    skyMat.uniforms.bottom.value.copy(cur.skyBottom);
    skyMat.uniforms.flash.value = flash;
    scene.fog.color.copy(cur.fog);
    scene.fog.far = cur.fogFar; scene.fog.near = cur.fogFar * 0.2;
    waterMat.color.copy(cur.water);
    waterMat.specular.copy(cur.spec);
    hemi.color.copy(cur.hemiSky); hemi.groundColor.copy(cur.hemiGround);
    hemi.intensity = cur.hemiI + flash * 1.4;
    sun.color.copy(cur.sun); sun.intensity = cur.sunI + flash * 0.6;
    sun.position.copy(cur.dir).multiplyScalar(50);
    disc.position.copy(cur.dir).multiplyScalar(250);
    disc.scale.setScalar(cur.discS);
    discMat.color.copy(cur.disc); discMat.opacity = cur.discA;
    disc.visible = cur.discA > 0.02;
    starMat.opacity = cur.stars * (0.75 + 0.25 * Math.sin(now * 0.002));
    rainMat.opacity = cur.rain * 0.5;
    lantern.intensity = cur.lantern;
    lanternMat.color.setRGB(1, 0.76, 0.43).multiplyScalar(0.5 + Math.min(1, cur.lantern / 2));
    spMat.color.copy(cur.spray);

    // camera: follow the boat, swing in behind it while sailing
    const goalX = follow ? bp.x : 0, goalZ = follow ? bp.y : 0;
    const tk = 1 - Math.exp(-dt * 3);
    target.x += (goalX - target.x) * tk; target.z += (goalZ - target.z) * tk;
    if (follow && driving && !(drag && drag.mode === 'orbit')) {
      let d = Math.atan2(-Math.cos(boatYaw), Math.sin(boatYaw)) - orbit.yaw; d = Math.atan2(Math.sin(d), Math.cos(d));
      orbit.yaw += d * (1 - Math.exp(-dt * 1.5));
      idle = 0;
    }
    if (manual) idle = 0;
    if (!reduceMotion && !drag && idle > 4) orbit.yaw += dt * 0.035;
    placeCamera();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  placeCamera();
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>

</body>
</html>
